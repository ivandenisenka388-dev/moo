name: Build APK with p4a

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    
    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y openjdk-17-jdk git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
        pip install --upgrade pip
        pip install python-for-android cython
    
    - name: Build APK
      run: |
        p4a apk \
          --private . \
          --package=com.telkko \
          --name "Telkko" \
          --version 1.0.0 \
          --bootstrap=sdl2 \
          --requirements="kivy==2.1.0,kivymd==1.1.1,pillow==9.5.0,sqlite3" \
          --arch=armeabi-v7a \
          --arch=arm64-v8a \
          --permission INTERNET \
          --permission WRITE_EXTERNAL_STORAGE \
          --permission READ_EXTERNAL_STORAGE
    
    - name: Upload APK
      uses: actions/upload-artifact@v3
      with:
        name: telkko-apk
        path: bin/*.apk
